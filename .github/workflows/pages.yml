name: pages

# The page is static, but its WASM is built from this crate and from four of slot's own source
# files. This fork needs slot as slot-nes-snes patches it, which is no commit anywhere, so it is
# rebuilt from the slot-nes-snes commit slot-nes-snes.ref names: slot v1.6.0's tarball, sha256
# checked against that commit's SLOT_PIN, with that commit's patches applied.
on:
  push:
    branches: [nes-snes]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancelling one on its way out. A cancelled deploy-pages leaves
# the site on whatever half of the artifact made it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: studio
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: slot-cart-studio

      - id: pin
        run: echo "ref=$(cat slot-cart-studio/slot-nes-snes.ref)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: felipecpaiva/slot-nes-snes
          ref: ${{ steps.pin.outputs.ref }}
          path: slot-nes-snes

      # Beside the studio, as the two sit on a desk, so ../slot means the same thing here.
      - name: slot with slot-nes-snes's patches
        run: |
          set -eu
          sh slot-nes-snes/scripts/fetch-slot.sh fetch "$GITHUB_WORKSPACE/slot"
          sh slot-nes-snes/scripts/apply-patches.sh build "$GITHUB_WORKSPACE/slot"

      # The channel rust-toolchain.toml pins, with the target it names.
      - name: Rust with the wasm32 target
        run: rustup toolchain install 1.96 --profile minimal --target wasm32-unknown-unknown

      - name: wasm-pack 0.15.0
        run: |
          set -eu
          curl -fsSL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-pack-v0.15.0-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: Build
        working-directory: slot-cart-studio
        run: wasm-pack build --release --target web --no-typescript --out-dir web/pkg

      - name: Stamp the commit into the footer
        working-directory: slot-cart-studio
        run: |
          set -eu
          sed -i "s/^const BUILD = 'dev';\$/const BUILD = '$GITHUB_SHA';/" web/studio.js
          grep -q "^const BUILD = '$GITHUB_SHA';\$" web/studio.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: slot-cart-studio/web

      - id: deploy
        uses: actions/deploy-pages@v4
